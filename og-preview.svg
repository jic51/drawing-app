<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f13"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(124,58,237,0.42)"/>
      <stop offset="55%"  stop-color="rgba(124,58,237,0.16)"/>
      <stop offset="100%" stop-color="rgba(124,58,237,0)"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff0000"/>
      <stop offset="17%"  stop-color="#ff7f00"/>
      <stop offset="33%"  stop-color="#ffff00"/>
      <stop offset="50%"  stop-color="#00ff00"/>
      <stop offset="67%"  stop-color="#0000ff"/>
      <stop offset="83%"  stop-color="#9400d3"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Resplandor detrás del logo -->
  <ellipse cx="600" cy="300" rx="430" ry="230" fill="url(#glow)"/>
  
  <!-- SketchSend title -->
  <text x="600" y="320" font-size="86" font-weight="800" text-anchor="middle"
        fill="url(#rainbow)" font-family="Syne, Arial Black, sans-serif">SketchSend ✏️</text>
  <!-- Subtitle -->
  <text x="600" y="395" font-size="34" text-anchor="middle" fill="rgba(200,200,220,0.7)"
        font-family="DM Sans, Arial, sans-serif">Every message is a drawing</text>
  <!-- CTA -->
  <rect x="450" y="460" width="300" height="60" rx="30" fill="rgba(124,58,237,0.8)"/>
  <text x="600" y="497" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="DM Sans, Arial, sans-serif" font-weight="600">Tap to see it →</text>
</svg>