<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f13"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff0000"/>
      <stop offset="17%"  stop-color="#ff7f00"/>
      <stop offset="33%"  stop-color="#ffff00"/>
      <stop offset="50%"  stop-color="#00ff00"/>
      <stop offset="67%"  stop-color="#0000ff"/>
      <stop offset="83%"  stop-color="#8b00ff"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glowing circle -->
  <circle cx="600" cy="260" r="140" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="60"/>
  <circle cx="600" cy="260" r="100" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.5)" stroke-width="3"/>
  <!-- Pencil emoji large -->
  <text x="600" y="300" font-size="120" text-anchor="middle" dominant-baseline="middle">✏️</text>
  <!-- SketchSend title -->
  <text x="600" y="420" font-size="80" font-weight="900" text-anchor="middle"
        fill="url(#rainbow)" font-family="Arial Black, Arial, sans-serif">SketchSend</text>
  <!-- Subtitle -->
  <text x="600" y="490" font-size="34" text-anchor="middle" fill="rgba(200,200,220,0.7)"
        font-family="Arial, sans-serif">Alguien te envió un dibujo ✨</text>
  <!-- CTA -->
  <rect x="450" y="530" width="300" height="60" rx="30" fill="rgba(124,58,237,0.8)"/>
  <text x="600" y="567" font-size="26" text-anchor="middle" fill="#ffffff"
        font-family="Arial, sans-serif" font-weight="600">Toca para verlo →</text>
</svg>